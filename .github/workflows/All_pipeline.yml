name: All‑Coin Pipeline (1m)

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'بازسازی اجباری (yes/no)'
        required: false
        default: 'no'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 1. نصب Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install

      - name: 2. دریافت کد مخزن (با LFS)
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: true   # <-- فعال‌سازی LFS

      - name: 3. راه‌اندازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. نصب کتابخانه‌ها
        run: |
          pip install --upgrade pip
          pip install pandas requests cryptography

      - name: 5. اجرای اسکریپت اصلی
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
        run: |
          echo "🚀 شروع اجرای All_pipeline.py برای ۵ ارز (۱ دقیقه)"
          python encrypted_data/All_pipeline.py
          echo "✅ اسکریپت با موفقیت تمام شد"

      - name: 6. ذخیره تغییرات در مخزن (با LFS)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          # اطمینان از اینکه فایل‌های LFS به‌درستی track شده‌اند
          git lfs track "encrypted_data/data.enc"
          git add .gitattributes
          git add data/All_Coins_Combined/ data/BTCUSDT/ data/ETHUSDT/ data/SOLUSDT/ data/XRPUSDT/ data/PAXGUSDT/ encrypted_data/data.enc zips/ 2>/dev/null || true
          git diff --staged --quiet || {
            git commit -m "All pipeline: update 5 coins (1m timeframe)"
            git pull --rebase --autostash origin main
            git push origin main
            echo "✅ تغییرات با موفقیت ارسال شد."
          }

      - name: 7. گزارش نهایی
        run: |
          echo "======================================="
          echo "✅ دانلود و پردازش ۵ ارز با تایم‌فریم ۱ دقیقه انجام شد"
          echo "📂 تعداد CSVهای ساخته شده در All_Coins_Combined:"
          ls -la data/All_Coins_Combined/ | wc -l
          echo "📦 فایل رمزنگاری: encrypted_data/data.enc"
          ls -lh encrypted_data/data.enc
          echo "======================================="
