name: Decrypt First 10 Results and Commit to Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decrypt-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Decrypt and extract first 10 results.enc
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD }}
        run: |
          BASE_DIR="Test-repo/results/Ttt3"
          OUTPUT_BASE="decrypted_results/Ttt3"
          mkdir -p "$OUTPUT_BASE"

          # پیدا کردن زیرپوشه‌های داخل BASE_DIR (حداکثر ۱۰ عدد)
          mapfile -t SUBDIRS < <(find "$BASE_DIR" -mindepth 1 -maxdepth 1 -type d | head -10)

          if [ ${#SUBDIRS[@]} -eq 0 ]; then
            echo "❌ هیچ زیرپوشه‌ای در $BASE_DIR یافت نشد."
            exit 1
          fi

          echo "✅ ${#SUBDIRS[@]} زیرپوشه برای بررسی یافت شد."

          for SUBDIR in "${SUBDIRS[@]}"; do
            ENC_FILE="$SUBDIR/results.enc"
            if [ ! -f "$ENC_FILE" ]; then
              echo "⚠️ فایل results.enc در $SUBDIR وجود ندارد، رد می‌شود."
              continue
            fi

            # نام نسبی زیرپوشه (مثلاً BTCUSDT-5m-2018-02-21_2018-02-28.csv)
            REL_SUBDIR=$(basename "$SUBDIR")
            OUTPUT_DIR="$OUTPUT_BASE/$REL_SUBDIR"
            mkdir -p "$OUTPUT_DIR"

            echo "🔓 رمزگشایی: $ENC_FILE -> $OUTPUT_DIR"

            node -e "
              const crypto = require('crypto');
              const fs = require('fs');
              const path = require('path');
              const { execSync } = require('child_process');
              const pass = process.env.RESULTS_PASSWORD;
              if (!pass) { console.error('رمز عبور تنظیم نشده'); process.exit(1); }
              const encData = fs.readFileSync('$ENC_FILE');
              const key = crypto.scryptSync(pass, 'salt', 32);
              const iv = encData.subarray(0, 16);
              const encrypted = encData.subarray(16);
              const decipher = crypto.createDecipheriv('aes-256-cbc', key, iv);
              let decrypted;
              try {
                decrypted = Buffer.concat([decipher.update(encrypted), decipher.final()]);
              } catch (e) {
                console.error('خطا در رمزگشایی:', e.message);
                process.exit(1);
              }
              const tarPath = path.join('$OUTPUT_DIR', 'temp.tar.gz');
              fs.writeFileSync(tarPath, decrypted);
              execSync('tar -xzf \"' + tarPath + '\" -C \"$OUTPUT_DIR\"');
              fs.unlinkSync(tarPath);
              console.log('✅ استخراج شد: $OUTPUT_DIR');
            "
          done

      - name: Commit and push decrypted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add decrypted_results/
          if git diff --cached --quiet; then
            echo "ℹ️ هیچ تغییر جدیدی برای commit وجود ندارد."
          else
            git commit -m "Add decrypted results (first 10 subdirs of Test-repo/results/Ttt3)"
            git pull --rebase
            git push
            echo "✅ تغییرات به مخزن push شد."
          end
