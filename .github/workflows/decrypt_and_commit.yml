name: Decrypt First 10 Results (Dynamic)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Decrypt first 10 results.enc
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD }}
        run: |
          BASE="Test-repo/results"
          OUT_BASE="decrypted_results"
          mkdir -p "$OUT_BASE"

          # پیدا کردن تمام فایل‌های results.enc در کل زیرشاخه‌ها (حداکثر 10 عدد)
          mapfile -t FILES < <(find "$BASE" -name "results.enc" -type f | head -10)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "❌ هیچ فایل results.enc در $BASE یافت نشد."
            exit 1
          fi

          for ENC in "${FILES[@]}"; do
            # مسیر نسبی (مثلاً Ttt3/BTCUSDT-5m-2018-02-21_2018-02-28.csv/results.enc)
            REL="${ENC#$BASE/}"
            # حذف /results.enc از انتها
            DIR_PATH="${REL%/results.enc}"
            TARGET="$OUT_BASE/$DIR_PATH"
            mkdir -p "$TARGET"

            echo "🔓 پردازش: $ENC -> $TARGET"

            node -e "
              const crypto = require('crypto');
              const fs = require('fs');
              const path = require('path');
              const { execSync } = require('child_process');
              const pass = process.env.RESULTS_PASSWORD;
              if (!pass) { console.error('رمز عبور تنظیم نشده'); process.exit(1); }
              const encData = fs.readFileSync('$ENC');
              const key = crypto.scryptSync(pass, 'salt', 32);
              const iv = encData.subarray(0, 16);
              const encrypted = encData.subarray(16);
              const decipher = crypto.createDecipheriv('aes-256-cbc', key, iv);
              let decrypted;
              try {
                decrypted = Buffer.concat([decipher.update(encrypted), decipher.final()]);
              } catch (e) {
                console.error('خطا در رمزگشایی:', e.message);
                process.exit(1);
              }
              const tarPath = path.join('$TARGET', 'temp.tar.gz');
              fs.writeFileSync(tarPath, decrypted);
              execSync('tar -xzf \"' + tarPath + '\" -C \"$TARGET\"');
              fs.unlinkSync(tarPath);
              console.log('✅ استخراج شد: $TARGET');
            "
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add decrypted_results/
          if git diff --cached --quiet; then
            echo "ℹ️ هیچ تغییری برای commit وجود ندارد."
          else
            git commit -m "Decrypted first 10 results.enc files"
            git pull --rebase
            git push
            echo "✅ تغییرات push شد."
          fi
