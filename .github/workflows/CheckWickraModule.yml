name: Check Wickra Module

# این ورک‌فلو رو دستی از تب Actions اجرا می‌کنی (workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  check-wickra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run wickra diagnostic
        run: node check-wickra.js
