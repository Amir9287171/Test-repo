name: PAXG Full Pipeline (with Proxy & Alternative APIs)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'مرحله (historical / recent / encrypt / full)'
        required: true
        default: 'full'
        type: choice
        options:
          - historical
          - recent
          - encrypt
          - full
      force_rebuild:
        description: 'بازسازی اجباری (yes/no)'
        required: false
        default: 'no'

permissions:
  contents: write

jobs:
  run-pipeline:
    # روش ۱: استفاده از self-hosted runner در منطقه غیرآمریکایی (اختیاری)
    # اگر self-hosted runner ندارید، این خط را کامنت کنید تا روی ubuntu-latest اجرا شود.
    # runs-on: [self-hosted, linux, x64]
    runs-on: ubuntu-latest  # اگر self-hosted ندارید، همین را نگه دارید
    
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests cryptography

      - name: Run PAXG pipeline with proxy & alternative APIs
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
          ACTION: ${{ github.event.inputs.action }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
          # روش ۳: پروکسی‌های رایگان
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          python encrypted_data/paxg_pipeline.py

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add data/All_Coins_Combined/ encrypted_data/data.enc encrypted_data/data_2025_2026_done.flag 2>/dev/null || true
          git diff --staged --quiet || {
            git commit -m "PAXG pipeline: update data and encrypted file"
            git pull --rebase --autostash
            git push
          }
