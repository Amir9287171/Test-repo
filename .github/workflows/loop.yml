name: Loop Workflow

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: loop-main
  cancel-in-progress: false

jobs:
  sync-and-continue:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------
      # 1. دریافت کد مخزن اصلی
      # ------------------------------------------------------------
      - name: 1. دریافت کد مخزن
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. دانلود استراتژی‌های جدید از مخزن سوم
      # ------------------------------------------------------------
      - name: 2. دانلود استراتژی‌های جدید از مخزن واسطه (با clone یک‌باره)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          echo "📥 کلون سبک مخزن سوم برای دریافت لیست استراتژی‌ها ..."
          rm -rf /tmp/third_repo_strats
          git clone --depth 1 --filter=blob:none https://x-access-token:${GH_TOKEN}@github.com/${THIRD_REPO}.git /tmp/third_repo_strats 2>&1 | tail -3

          if [ ! -d /tmp/third_repo_strats/strategies ]; then
            echo "⚠️ پوشه strategies در مخزن سوم خالی یا وجود ندارد."
            exit 0
          fi

          CHANGED=false
          for SRC in /tmp/third_repo_strats/strategies/*.js; do
            [ -f "$SRC" ] || continue
            FILE=$(basename "$SRC")
            DEST="strategies/${FILE}"
            if [ -f "$DEST" ] && diff -q "$DEST" "$SRC" >/dev/null 2>&1; then
              echo "✅ $FILE بدون تغییر است."
              continue
            fi
            echo "⬇️ به‌روزرسانی $FILE ..."
            cp "$SRC" "$DEST"
            CHANGED=true
          done
          rm -rf /tmp/third_repo_strats

          if $CHANGED; then
            echo "📌 تغییرات شناسایی شد؛ commit و push انجام می‌شود."
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            git checkout main || git checkout -b main origin/main
            git add strategies/
            git commit -m "download new strategies from 3rd repo" || true
            git pull --rebase && git push
          else
            echo "ℹ️ هیچ استراتژی جدیدی اضافه نشد."
          fi

      # ------------------------------------------------------------
      # 3. دریافت آخرین نتایج commit شده از مخزن (جایگزین artifact)
      # ------------------------------------------------------------
      - name: 3. دریافت آخرین نتایج با git pull
        run: |
          echo "🔃 دریافت آخرین نتایج از مخزن اصلی (git pull)..."
          git checkout main || git checkout -b main origin/main
          git pull --rebase
          if [ -d results ]; then
            echo "✅ پوشه results موجود است: $(ls -1 results/ | wc -l) فایل"
          else
            echo "ℹ️ پوشه results وجود ندارد."
          fi
          if [ -d errors ]; then
            echo "✅ پوشه errors موجود است: $(ls -1 errors/ | wc -l) فایل"
          else
            echo "ℹ️ پوشه errors وجود ندارد."
          fi
          if [ -d logs ]; then
            echo "✅ پوشه logs موجود است: $(ls -1 logs/ | wc -l) فایل"
          else
            echo "ℹ️ پوشه logs وجود ندارد."
          fi

      # ------------------------------------------------------------
      # 4. لاگ‌های اولیه پیش از آپلود
      # ------------------------------------------------------------
      - name: 4. لاگ‌های اولیه پیش از آپلود
        run: |
          echo "=============================================="
          echo "   📦 لاگ آپلود به مخزن سوم"
          echo "=============================================="
          echo ""
          echo "1- محتویات پوشه results (در صورت وجود):"
          if [ -d results ]; then
            find results -type f -name "results.enc" | wc -l
          else
            echo "   (results وجود ندارد)"
          fi
          echo ""
          TOTAL_RESULTS=$(find results -name "results.enc" -type f 2>/dev/null | wc -l)
          echo "2- تعداد فایل‌های results.enc: $TOTAL_RESULTS"
          TOTAL_ERRORS=$(find errors -name "*.enc" -type f 2>/dev/null | wc -l)
          echo "3- تعداد فایل‌های لاگ خطا (.enc): $TOTAL_ERRORS"
          TOTAL_LOGS=$(find logs -name "*.log" -type f 2>/dev/null | wc -l)
          echo "4- تعداد فایل‌های لاگ اجرا (.log): $TOTAL_LOGS"
          if [ "$TOTAL_RESULTS" -eq 0 ] && [ "$TOTAL_ERRORS" -eq 0 ] && [ "$TOTAL_LOGS" -eq 0 ]; then
            echo "5- ⚠️ هیچ فایل نتیجه یا خطایی برای آپلود وجود ندارد."
          fi
          echo "6- مخزن سوم (THIRD_REPO): ${{ secrets.THIRD_REPO }}"
          echo "7- وضعیت CROSS_REPO_TOKEN: $([ -z "$CROSS_REPO_TOKEN" ] && echo '❌ تنظیم نشده' || echo '✅ تنظیم شده')"
          echo "8- تست احراز هویت با توکن cross-repo:"
          gh auth status --hostname github.com || echo "⚠️ احراز هویت ناموفق"
          echo "9-11- اطلاعات مخزن سوم (یک تماس API برای هر سه فیلد):"
          REPO_INFO=$(gh api "repos/${{ secrets.THIRD_REPO }}" 2>/dev/null || echo "{}")
          echo "    full_name: $(echo "$REPO_INFO" | jq -r '.full_name // "نامشخص"')"
          echo "    visibility: $(echo "$REPO_INFO" | jq -r '.visibility // "نامشخص"')"
          echo "    default_branch: $(echo "$REPO_INFO" | jq -r '.default_branch // "main (حدس)"')"
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}

      # ------------------------------------------------------------
      # 4.5. حذف پوشه logs برای جلوگیری از آپلود و صرفه‌جویی در زمان
      # ------------------------------------------------------------
      - name: 4.5. حذف پوشه logs
        run: |
          if [ -d logs ]; then
            echo "🧹 حذف پوشه logs و محتویات آن (برای جلوگیری از آپلود)..."
            rm -rf logs
          else
            echo "ℹ️ پوشه logs وجود ندارد."
          fi

      # ------------------------------------------------------------
      # 5.0. گرفتن قفل مخزن سوم (جلوگیری از تداخل با اکانت دیگر)
      # ------------------------------------------------------------
      - name: 5.0. گرفتن قفل مخزن سوم
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          command -v jq &> /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)
          LOCK_PATH="automation.lock"
          LOCK_TTL=1800
          LOCK_OWNER="${GITHUB_REPOSITORY}-run${GITHUB_RUN_ID}-loop-upload"
          ACQUIRED=false
          for i in $(seq 1 60); do
            RESP=$(gh api "repos/$THIRD_REPO/contents/$LOCK_PATH" 2>/dev/null || true)
            if [ -z "$RESP" ] || [ "$RESP" = "null" ] || ! echo "$RESP" | jq -e '.sha' >/dev/null 2>&1; then
              CONTENT=$(echo "{\"owner\":\"$LOCK_OWNER\",\"acquired_at\":$(date +%s)}" | base64 -w0)
              if gh api "repos/$THIRD_REPO/contents/$LOCK_PATH" -X PUT -f message="acquire lock ($LOCK_OWNER)" -f content="$CONTENT" -f branch="main" >/dev/null 2>&1; then
                echo "✅ قفل مخزن سوم گرفته شد."
                ACQUIRED=true
                break
              fi
            else
              SHA=$(echo "$RESP" | jq -r '.sha')
              LOCK_CONTENT=$(echo "$RESP" | jq -r '.content' | base64 -d 2>/dev/null || echo "{}")
              LOCK_TS=$(echo "$LOCK_CONTENT" | jq -r '.acquired_at // 0')
              AGE=$(( $(date +%s) - LOCK_TS ))
              if [ "$AGE" -gt "$LOCK_TTL" ]; then
                echo "⚠️ قفل قدیمی (سن ${AGE}s) یافت شد؛ تصرف اجباری..."
                CONTENT=$(echo "{\"owner\":\"$LOCK_OWNER\",\"acquired_at\":$(date +%s)}" | base64 -w0)
                if gh api "repos/$THIRD_REPO/contents/$LOCK_PATH" -X PUT -f message="force-acquire stale lock ($LOCK_OWNER)" -f content="$CONTENT" -f sha="$SHA" -f branch="main" >/dev/null 2>&1; then
                  echo "✅ قفل به‌صورت اجباری گرفته شد."
                  ACQUIRED=true
                  break
                fi
              else
                echo "⏳ قفل در دست $(echo "$LOCK_CONTENT" | jq -r '.owner // "نامشخص"') است (سن ${AGE}s). صبر می‌کنم... (تلاش $i/60)"
              fi
            fi
            sleep $(( (RANDOM % 10) + 5 ))
          done
          if [ "$ACQUIRED" != "true" ]; then
            echo "❌ گرفتن قفل مخزن سوم پس از تلاش‌های متعدد ناموفق بود."
            exit 1
          fi

      # ------------------------------------------------------------
      # 5. آپلود نتایج و لاگ‌های خطا به مخزن سوم (با retry)
      # ------------------------------------------------------------
      - name: 5. آپلود نتایج و لاگ‌های خطا به مخزن واسطه (با clone یک‌باره)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          echo "=============================================="
          echo "   📤 شروع فرآیند آپلود (clone-based)"
          echo "=============================================="

          TOTAL_RESULTS=$(find results -name "results.enc" -type f 2>/dev/null | wc -l)
          TOTAL_ERRORS=$(find errors -name "*.enc" -type f 2>/dev/null | wc -l)
          echo "تعداد فایل‌های results.enc: $TOTAL_RESULTS | تعداد لاگ‌های خطا: $TOTAL_ERRORS"

          if [ "$TOTAL_RESULTS" -eq 0 ] && [ "$TOTAL_ERRORS" -eq 0 ]; then
            echo "⚠️ هیچ فایلی برای آپلود وجود ندارد."
            exit 0
          fi

          # یک‌بار clone از مخزن سوم -- نه N×2 تماس API برای هر فایل
          rm -rf /tmp/third_repo_upload
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/${THIRD_REPO}.git /tmp/third_repo_upload
          cd /tmp/third_repo_upload
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          SUCCESS_UPLOADS=0
          SKIPPED_UPLOADS=0

          if [ -d "$GITHUB_WORKSPACE/results" ]; then
            while read -r ENC; do
              REL=${ENC#"$GITHUB_WORKSPACE"/results/}
              DEST="backtest_results/$REL"
              mkdir -p "$(dirname "$DEST")"
              if [ -f "$DEST" ]; then
                SKIPPED_UPLOADS=$((SKIPPED_UPLOADS + 1))
              else
                cp "$ENC" "$DEST"
                SUCCESS_UPLOADS=$((SUCCESS_UPLOADS + 1))
              fi
            done < <(find "$GITHUB_WORKSPACE/results" -name "results.enc" -type f)
          fi

          if [ -d "$GITHUB_WORKSPACE/errors" ]; then
            while read -r ERR; do
              DEST="backtest_results/logs/$(basename "$ERR")"
              mkdir -p "$(dirname "$DEST")"
              if [ -f "$DEST" ]; then
                SKIPPED_UPLOADS=$((SKIPPED_UPLOADS + 1))
              else
                cp "$ERR" "$DEST"
                SUCCESS_UPLOADS=$((SUCCESS_UPLOADS + 1))
              fi
            done < <(find "$GITHUB_WORKSPACE/errors" -name "*.enc" -type f)
          fi

          echo "آپلودهای جدید: $SUCCESS_UPLOADS | skip شده (از قبل موجود): $SKIPPED_UPLOADS"

          if [ "$SUCCESS_UPLOADS" -gt 0 ]; then
            git add -A
            git commit -m "upload results (run ${{ github.run_id }})"
            RETRY=0; MAX=20
            while [ $RETRY -lt $MAX ]; do
              if git pull --rebase && git push; then
                echo "✅ push موفق"
                break
              else
                RETRY=$((RETRY+1))
                sleep $(( (RANDOM % 5) + 2 ))
              fi
            done
          else
            echo "ℹ️ چیز جدیدی برای commit نبود."
          fi
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/third_repo_upload

      # ------------------------------------------------------------
      # 5.9. آزاد کردن قفل مخزن سوم (همیشه اجرا می‌شود تا قفل گیر نکند)
      # ------------------------------------------------------------
      - name: 5.9. آزاد کردن قفل مخزن سوم
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          THIRD_REPO: ${{ secrets.THIRD_REPO }}
        run: |
          RESP=$(gh api "repos/$THIRD_REPO/contents/automation.lock" 2>/dev/null || true)
          if [ -n "$RESP" ] && [ "$RESP" != "null" ] && echo "$RESP" | jq -e '.sha' >/dev/null 2>&1; then
            SHA=$(echo "$RESP" | jq -r '.sha')
            gh api "repos/$THIRD_REPO/contents/automation.lock" -X DELETE -f message="release lock" -f sha="$SHA" -f branch="main" >/dev/null 2>&1 || true
            echo "🔓 قفل مخزن سوم آزاد شد."
          else
            echo "ℹ️ قفلی برای آزاد کردن یافت نشد."
          fi

      # ------------------------------------------------------------
      # 6. پاک‌سازی نتایج و خطاها از مخزن اصلی (نسخه مقاوم با flag)
      # ------------------------------------------------------------
      - name: 6. پاک‌سازی نتایج و خطاها از مخزن اصلی
        run: |
          if [ -d results ] || [ -d errors ] || [ -d logs ]; then
            echo "🧹 حذف پوشه‌های results, errors, logs از مخزن اصلی..."
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            git checkout main || git checkout -b main origin/main
            rm -rf results errors logs
            git add -A .
            git commit -m "clean up uploaded results, logs and errors" || true
            RETRY=0; MAX=1000
            PUSH_SUCCESS=false
            while [ $RETRY -lt $MAX ]; do
              git stash push --include-untracked --quiet 2>/dev/null || true
              if git pull --rebase && git push; then
                echo "✅ پاک‌سازی و push موفق بود."
                git stash drop --quiet 2>/dev/null || true
                PUSH_SUCCESS=true
                break
              else
                git stash drop --quiet 2>/dev/null || true
                RETRY=$((RETRY+1))
                sleep $(( (RANDOM % 10) + 1 ))
              fi
            done
            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ push پاک‌سازی بعد از $MAX تلاش ناموفق ماند"
              exit 1
            fi
          else
            echo "ℹ️ چیزی برای پاک‌سازی وجود ندارد."
          fi

      # ------------------------------------------------------------
      # 7. انتخاب استراتژی بعدی با در نظر گرفتن چانک‌های نیمه‌تمام
      # ------------------------------------------------------------
      - name: 7. انتخاب استراتژی بعدی و ادامه چرخه
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 جستجوی استراتژی دارای چانک باقی‌مانده..."

          PROGRESS_FILE="progress.json"
          if [ ! -f "$PROGRESS_FILE" ]; then
            echo "{}" > "$PROGRESS_FILE"
          fi

          # لیست استراتژی‌ها
          STRATEGIES=$(find strategies -maxdepth 1 -name "*.js" -exec basename {} \; | sort)
          if [ -z "$STRATEGIES" ]; then
            echo "❌ هیچ استراتژی‌ای در پوشه strategies یافت نشد. چرخه متوقف می‌شود."
            exit 0
          fi

          # تعداد کل فایل‌های CSV برای محاسبه تعداد کل چانک‌ها
          TOTAL_CSV=$(find data/All_Coins_Combined -maxdepth 1 -name "*.csv" 2>/dev/null | wc -l)
          if [ "$TOTAL_CSV" -eq 0 ]; then
            echo "❌ داده‌ای یافت نشد. چرخه متوقف می‌شود."
            exit 0
          fi
          CHUNK_SIZE=100
          TOTAL_CHUNKS=$(( (TOTAL_CSV + CHUNK_SIZE - 1) / CHUNK_SIZE ))

          SELECTED=""
          for STRAT in $STRATEGIES; do
            # بررسی ۱: از progress.json
            DONE_COUNT=$(jq -r --arg s "$STRAT" '.[$s] // [] | length' "$PROGRESS_FILE")

            # بررسی ۲: شمارش results.enc روی دیسک (پوشه _5m به‌عنوان شاخص اصلی)
            STRAT_BASE="${STRAT%.js}"
            STRAT_DIR="results/${STRAT_BASE}_5m"
            ENC_COUNT=0
            if [ -d "$STRAT_DIR" ]; then
              ENC_COUNT=$(find "$STRAT_DIR" -name "results.enc" -type f | wc -l)
            fi

            # استراتژی کامل است اگر: progress.json کامل باشد یا تعداد results.enc روی دیسک کافی باشد
            if [ "$DONE_COUNT" -ge "$TOTAL_CHUNKS" ] || [ "$ENC_COUNT" -ge "$TOTAL_CSV" ]; then
              echo "ℹ️ استراتژی $STRAT کامل شده است (progress: $DONE_COUNT/$TOTAL_CHUNKS، دیسک: $ENC_COUNT/$TOTAL_CSV)."
            else
              SELECTED="$STRAT"
              echo "✅ استراتژی $STRAT: $DONE_COUNT از $TOTAL_CHUNKS چانک در progress، $ENC_COUNT از $TOTAL_CSV فایل روی دیسک. انتخاب شد."
              break
            fi
          done

          if [ -z "$SELECTED" ]; then
            echo "🎉 همهٔ استراتژی‌ها کامل شده‌اند. چرخه متوقف می‌شود."
            exit 0
          fi

          echo "🚀 راه‌اندازی backtest.yml برای $SELECTED ..."
          gh workflow run backtest.yml --ref main -f strategy_name="$SELECTED"
