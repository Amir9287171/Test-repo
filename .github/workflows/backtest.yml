name: Complete 24/7 Pipeline

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      strategy_name:
        description: 'نام فایل استراتژی (مثلاً kkk3.js). خالی = همه اجرا شوند'
        required: false
        default: ''
      filter_start_date:
        description: 'تاریخ شروع فایل‌ها (YYYY-MM-DD)'
        required: false
        default: ''
      filter_end_date:
        description: 'تاریخ پایان فایل‌ها (YYYY-MM-DD)'
        required: false
        default: ''

concurrency:
  group: backtest-main
  cancel-in-progress: false

jobs:
  check-completion:
    runs-on: ubuntu-latest
    outputs:
      all_completed: ${{ steps.check.outputs.all_completed }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: بررسی وجود نتایج قبلی
        id: check
        run: echo "all_completed=false" >> $GITHUB_OUTPUT

  prepare:
    needs: check-completion
    if: needs.check-completion.outputs.all_completed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      strategies: ${{ steps.list_strategies.outputs.files }}
      chunks:   ${{ steps.build_chunks.outputs.chunks }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. کش فایل‌های ZIP
        uses: actions/cache@v4
        with:
          path: zips
          key: zips-${{ hashFiles('encrypted_data/prepare_data.py') }}-${{ github.run_id }}
          restore-keys: |
            zips-${{ hashFiles('encrypted_data/prepare_data.py') }}-

      - name: 3. راه‌اندازی پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. نصب کتابخانه‌های پایتون
        run: pip install pandas requests cryptography

      - name: 0. ساختن پوشه src
        run: mkdir -p encrypted_data/src

      - name: 🔓 مدیریت باز کردن قفل
        id: unlock
        env:
          CODE_PASSWORD: ${{ secrets.CODE_PASSWORD }}
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
        run: |
          echo "unlocked=false" >> $GITHUB_OUTPUT
          UNLOCK_FILE="encrypted_data/src/unlock.txt"
          FLAG_FILE="encrypted_data/src/.unlocked.flag"
          if [ -f "$UNLOCK_FILE" ] && grep -q "^3$" "$UNLOCK_FILE"; then
            echo "📊 وضعیت unlock=3"
            if [ -d results ]; then
              find results -name "results.enc" -type f | while read ENC; do
                DIR=$(dirname "$ENC")
                node -e "const crypto=require('crypto'),fs=require('fs');const pass=process.env.RESULTS_PASSWORD;const data=fs.readFileSync('$ENC');const key=crypto.scryptSync(pass,'salt',32);const iv=data.slice(0,16),enc=data.slice(16);const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);const dec=Buffer.concat([decipher.update(enc),decipher.final()]);fs.writeFileSync('$DIR/results.tar.gz',dec);"
                tar -xzf "$DIR/results.tar.gz" -C "$DIR" && rm -f "$DIR/results.tar.gz"
              done
              git config user.name "github-actions[bot]" && git config user.email "actions@github.com"
              git add results/
              git commit -m "extract results (unlock 3)" || true
              git pull --rebase && git push
            fi
            rm -f "$UNLOCK_FILE" "$FLAG_FILE"
          elif [ -f "$UNLOCK_FILE" ] && grep -q "^1$" "$UNLOCK_FILE"; then
            echo "🔓 وضعیت unlock=1"
            echo "unlocked=true" >> $GITHUB_OUTPUT
            if [ -f encrypted_data/src.enc ]; then
              mkdir -p temp_src_restore
              node -e "const crypto=require('crypto'),fs=require('fs');const pass=process.env.CODE_PASSWORD;const data=fs.readFileSync('encrypted_data/src.enc');const key=crypto.scryptSync(pass,'salt',32);const iv=data.slice(0,16),enc=data.slice(16);const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);const dec=Buffer.concat([decipher.update(enc),decipher.final()]);fs.writeFileSync('src.tar.gz',dec);"
              tar -xzf src.tar.gz -C temp_src_restore
              mkdir -p encrypted_data/src
              cp -r temp_src_restore/* encrypted_data/src/ && rm -rf temp_src_restore src.tar.gz
            fi
            git config user.name "github-actions[bot]" && git config user.email "actions@github.com"
            git add encrypted_data/src/*.js encrypted_data/src/.unlocked.flag 2>/dev/null || true
            git add "$UNLOCK_FILE" 2>/dev/null || true
            if [ -f "$UNLOCK_FILE" ]; then
              rm -f "$UNLOCK_FILE"
              git rm --cached "$UNLOCK_FILE" 2>/dev/null || true
              git add "$UNLOCK_FILE" 2>/dev/null || true
            fi
            git commit -m "unlock source files" || true
            git stash --include-untracked 2>/dev/null || true
            git pull --rebase
            git stash pop 2>/dev/null || true
            git push
          else
            echo "🧹 پاکسازی فایل‌های JSON نتایج"
            if [ -d "results" ]; then
              find results -type f ! -name "results.enc" \( -name "*.json" -o -name "*.tar.gz" \) -delete
              if find results -type f ! -name "results.enc" | grep -q .; then
                git config user.name "github-actions[bot]" && git config user.email "actions@github.com"
                git add results/ && git commit -m "cleanup results" || true
                git pull --rebase && git push
              fi
            else
              echo "📁 پوشه results وجود ندارد، نیازی به پاکسازی نیست."
            fi
            echo "🔒 حالت عادی (بدون باز کردن قفل)"
          fi

      - name: 5. آماده‌سازی داده‌های ۲۰۲۵/۲۰۲۶ در صورت نیاز
        id: prep_2025
        run: |
          FLAG="encrypted_data/data_2025_2026_done.flag"
          if [ ! -f "$FLAG" ]; then
            echo "🆕 در حال پردازش داده‌های ۲۰۲۵/۲۰۲۶..."
            python encrypted_data/prepare_2025_2026.py
            touch "$FLAG"
            echo "flag_created=true" >> $GITHUB_OUTPUT
          else
            echo "✅ داده‌ها قبلاً پردازش شده‌اند."
            echo "flag_created=false" >> $GITHUB_OUTPUT
          fi

      - name: 6. ارسال پرچم به مخزن در صورت ایجاد
        if: steps.prep_2025.outputs.flag_created == 'true'
        run: |
          git config user.name "github-actions[bot]" && git config user.email "actions@github.com"
          git pull --rebase
          git add encrypted_data/data_2025_2026_done.flag
          git commit -m "mark 2025/2026 prepared" || true
          git push

      # ============================================================
      # ⚠️ بخش تغییر یافته: data.enc دیگر در گیت/LFS نگهداری نمی‌شود.
      # به‌جای آن با actions/cache ذخیره و بازیابی می‌شود:
      # - اگر کش موجود باشد → مستقیم decrypt و استفاده می‌شود (سریع، بدون دانلود مجدد از Binance).
      # - اگر کش موجود نباشد (اولین اجرا یا evict شدن) → All_pipeline.py از نو
      #   داده را دانلود/بسازد/رمزنگاری می‌کند، سپس در پایان job همین اکشن به‌صورت
      #   خودکار data.enc تازه را کش می‌کند.
      # ============================================================
      - name: 7. کش کردن data.enc
        id: cache-data-enc
        uses: actions/cache@v4
        with:
          path: encrypted_data/data.enc
          key: data-enc-v1

      - name: 7.1 ساخت و رمزنگاری داده (فقط در صورت نبود کش)
        if: steps.cache-data-enc.outputs.cache-hit != 'true'
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
        run: |
          echo "⚠️ کش data.enc یافت نشد. در حال ساخت از نو با All_pipeline.py ..."
          python encrypted_data/All_pipeline.py

      - name: 7.2 رمزگشایی data.enc برای استفاده در بکتست
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
        run: |
          if [ ! -f encrypted_data/data.enc ]; then
            echo "❌ encrypted_data/data.enc پس از مرحله ساخت هم پیدا نشد!"
            exit 1
          fi
          node -e "const crypto=require('crypto'),fs=require('fs');const pass=process.env.DATA_PASSWORD;const data=fs.readFileSync('encrypted_data/data.enc');const key=crypto.scryptSync(pass,'salt',32);const iv=data.slice(0,16),enc=data.slice(16);const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);const dec=Buffer.concat([decipher.update(enc),decipher.final()]);fs.writeFileSync('data.tar.gz',dec);"
          mkdir -p data && tar -xzf data.tar.gz -C data && rm data.tar.gz
          echo "✅ داده استخراج شد."
      # ============================================================
      # پایان بخش تغییر یافته
      # ============================================================

      - name: 10. تحلیل فایل‌های سورس
        id: source_analysis
        run: |
          ALL_FULL=true; ONE_FULL=false
          for f in encrypted_data/src/*.js encrypted_data/src/*.py; do
            [ -f "$f" ] && [ -s "$f" ] && ONE_FULL=true
            [ -f "$f" ] && [ ! -s "$f" ] && ALL_FULL=false
          done
          echo "all_full=$ALL_FULL" >> $GITHUB_OUTPUT
          echo "one_full=$ONE_FULL" >> $GITHUB_OUTPUT

      - name: 11. رمزنگاری فایل‌های سورس (ادغام هوشمند)
        if: steps.source_analysis.outputs.one_full == 'true' && steps.unlock.outputs.unlocked != 'true'
        env:
          CODE_PASSWORD: ${{ secrets.CODE_PASSWORD }}
        run: |
          if [ "${{ steps.source_analysis.outputs.all_full }}" = "true" ]; then
            tar -czf src.tar.gz -C encrypted_data/src .
          else
            mkdir -p temp_merge
            if [ -f encrypted_data/src.enc ]; then
              node -e "const crypto=require('crypto'),fs=require('fs');const pass=process.env.CODE_PASSWORD;const data=fs.readFileSync('encrypted_data/src.enc');const key=crypto.scryptSync(pass,'salt',32);const iv=data.slice(0,16),enc=data.slice(16);const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);const dec=Buffer.concat([decipher.update(enc),decipher.final()]);fs.writeFileSync('src_old.tar.gz',dec);"
              tar -xzf src_old.tar.gz -C temp_merge && rm src_old.tar.gz
            fi
            for f in encrypted_data/src/*.js encrypted_data/src/*.py; do
              [ -f "$f" ] && [ -s "$f" ] && cp "$f" temp_merge/
            done
            tar -czf src.tar.gz -C temp_merge .
            rm -rf temp_merge
          fi
          node -e "const crypto=require('crypto'),fs=require('fs');const pass=process.env.CODE_PASSWORD;const key=crypto.scryptSync(pass,'salt',32);const iv=crypto.randomBytes(16);const cipher=crypto.createCipheriv('aes-256-cbc',key,iv);const input=fs.readFileSync('src.tar.gz');const enc=Buffer.concat([cipher.update(input),cipher.final()]);fs.writeFileSync('encrypted_data/src.enc',Buffer.concat([iv,enc]));"
          rm src.tar.gz

      - name: 12. پاک کردن محتوای فایل‌های سورس (نگه داشتن فایل‌ها)
        if: steps.source_analysis.outputs.one_full == 'true' && steps.unlock.outputs.unlocked != 'true'
        run: |
          git config user.name "github-actions[bot]" && git config user.email "actions@github.com"
          for f in encrypted_data/src/*.js encrypted_data/src/*.py; do [ -f "$f" ] && echo -n "" > "$f"; done
          rm -f encrypted_data/src/.unlocked.flag
          git add encrypted_data/src/ encrypted_data/src.enc
          git commit -m "wipe source files and update src.enc" || true
          # 🆕 stash کردن تغییرات unstaged قبل از pull --rebase
          git stash --include-untracked --quiet || true
          if git pull --rebase && git push; then
            git stash drop --quiet || true
          else
            git stash drop --quiet || true
            exit 1
          fi

      - name: 13. رمزگشایی src.enc برای بکتست
        env:
          CODE_PASSWORD: ${{ secrets.CODE_PASSWORD }}
        run: |
          node -e "const crypto=require('crypto'),fs=require('fs');const pass=process.env.CODE_PASSWORD;const data=fs.readFileSync('encrypted_data/src.enc');const key=crypto.scryptSync(pass,'salt',32);const iv=data.slice(0,16),enc=data.slice(16);const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);const dec=Buffer.concat([decipher.update(enc),decipher.final()]);fs.writeFileSync('src.tar.gz',dec);"
          tar -xzf src.tar.gz -C encrypted_data/src
          rm src.tar.gz

      - name: بررسی کامل بودن فایل‌های سورس پس از بازیابی
        run: |
          echo "===== بررسی فایل‌های بازیابی‌شده ====="
          for f in encrypted_data/src/backtest-core.js encrypted_data/src/divergence-detector.js; do
            if [ ! -f "$f" ]; then
              echo "❌ $f وجود ندارد!"
              exit 1
            fi
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -eq 0 ]; then
              echo "❌ $f خالی است (بازیابی ناموفق)!"
              exit 1
            fi
            echo "✅ $f ($SIZE بایت)"
          done

      - name: 15. راه‌اندازی Node.js و نصب papaparse
        uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: npm install papaparse

      - name: 16. لیست کردن استراتژی‌ها
        id: list_strategies
        run: |
          STRAT_INPUT="${{ github.event.inputs.strategy_name }}"
          if [ -n "$STRAT_INPUT" ]; then
            if [ -f "strategies/$STRAT_INPUT" ]; then
              files=$(echo "$STRAT_INPUT" | jq -R -s -c 'split("\n")[:-1]')
            else
              echo "❌ فایل $STRAT_INPUT در strategies یافت نشد."; exit 1
            fi
          else
            files=$(find strategies -maxdepth 1 -name "*.js" -exec basename {} \; | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: 17. فیلتر و ساختن چانک‌های پویا (با هوشمندی progress.json)
        id: build_chunks
        run: |
          START_DATE="${{ github.event.inputs.filter_start_date }}"
          END_DATE="${{ github.event.inputs.filter_end_date }}"
          DATA_DIR="data/All_Coins_Combined"
          PROGRESS_FILE="progress.json"

          mapfile -t ALL_FILES < <(find "$DATA_DIR" -maxdepth 1 -name "*.csv" -printf '%f\n' | sort)

          declare -A DONE_CHUNKS
          if [ -f "$PROGRESS_FILE" ]; then
            STRAT_NAME="${{ github.event.inputs.strategy_name }}"
            if [ -z "$STRAT_NAME" ]; then
              STRAT_NAME=$(find strategies -maxdepth 1 -name "*.js" -exec basename {} \; | head -1)
            fi
            if [ -n "$STRAT_NAME" ]; then
              DONE_LIST=$(jq -r --arg s "$STRAT_NAME" '.[$s] // [] | join(" ")' "$PROGRESS_FILE" 2>/dev/null)
              for chunk in $DONE_LIST; do
                DONE_CHUNKS[$chunk]=1
              done
              echo "📊 چانک‌های انجام‌شده برای $STRAT_NAME: ${!DONE_CHUNKS[*]}"
            fi
          fi

          FILTERED=()
          for f in "${ALL_FILES[@]}"; do
            if [[ $f =~ ([0-9]{4}-[0-9]{2}-[0-9]{2})_ ]]; then
              FILE_START="${BASH_REMATCH[1]}"
              if [ -n "$START_DATE" ]; then
                [[ "$FILE_START" < "$START_DATE" ]] && continue
              fi
              if [ -n "$END_DATE" ]; then
                [[ "$FILE_START" > "$END_DATE" ]] && continue
              fi
            fi
            FILTERED+=("$f")
          done

          cnt=${#FILTERED[@]}
          SIZE=100

          n=$(( (cnt + SIZE - 1) / SIZE ))
          chunks="["
          CHUNKS_ADDED=0
          for ((i=0; i<n; i++)); do
            s=$((i*SIZE))
            if [ -n "${DONE_CHUNKS[$s]}" ]; then
              echo "⏩ چانک $s قبلاً در progress.json ثبت شده. نادیده گرفته می‌شود."
              continue
            fi
            STRAT_DIR="results/${STRAT_NAME}_5m"
            if [ -d "$STRAT_DIR" ]; then
              ENC_COUNT=$(find "$STRAT_DIR" -name "results.enc" -type f | wc -l)
              if [ "$ENC_COUNT" -ge "$cnt" ]; then
                echo "⏩ استراتژی $STRAT_NAME کامل است ($ENC_COUNT results.enc روی دیسک). هیچ چانکی اضافه نمی‌شود."
                break
              fi
            fi
            [ $CHUNKS_ADDED -gt 0 ] && chunks+=", "
            chunks+="$s"
            CHUNKS_ADDED=$((CHUNKS_ADDED + 1))
          done
          chunks+="]"
          echo "chunks=$chunks" >> $GITHUB_OUTPUT
          echo "تعداد کل فایل‌های فیلتر شده: $cnt, اندازه چانک: $SIZE, تعداد چانک‌های جدید: $CHUNKS_ADDED از $n"

      - name: تأیید فایل‌های سورس قبل از بارگذاری
        run: |
          echo "===== بررسی فایل‌های encrypted_data/src ====="
          ls -l encrypted_data/src/
          for f in encrypted_data/src/backtest-core.js encrypted_data/src/divergence-detector.js; do
            if [ ! -f "$f" ]; then
              echo "❌ $f وجود ندارد!"
              exit 1
            fi
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -eq 0 ]; then
              echo "❌ $f خالی است!"
              exit 1
            fi
            echo "✅ $f ($SIZE بایت) آماده‌ی بارگذاری"
          done

      - name: 18. بارگذاری محیط آماده شده
        uses: actions/upload-artifact@v4
        with:
          name: prep
          # ⚠️ رفع باگ امنیتی: قبلاً /tmp/artifact_src/ (نسخه‌ی رمزگشایی‌شده‌ی
          # backtest-core.js و divergence-detector.js) هم اینجا آپلود می‌شد. چون
          # این artifact برای هر کسی با دسترسی خواندن به تب Actions قابل دانلوده،
          # این کار عملاً رمزنگاری AES-256-CBC روی src.enc را بی‌اثر می‌کرد. الان
          # سورس رمزگشایی‌شده اصلاً وارد artifact نمی‌شود؛ جاب backtest به‌جایش
          # خودش encrypted_data/src.enc را مستقیماً decrypt می‌کند (پایین همین فایل).
          path: |
            data/
            strategies/
            node_modules/
            package.json

  backtest:
    needs: [check-completion, prepare]
    if: needs.prepare.outputs.strategies != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        strategy_file: ${{ fromJson(needs.prepare.outputs.strategies) }}
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: 2. دریافت محیط آماده شده
        uses: actions/download-artifact@v4
        with:
          name: prep

      - name: 3. راه‌اندازی Node.js
        uses: actions/setup-node@v4
        with: { node-version: '18' }

      - name: بازیابی فایل‌های سورس (رمزگشایی مستقیم src.enc)
        # ⚠️ رفع باگ امنیتی: قبلاً این استپ با find . در کل workspace دنبال کپی‌های
        # پراکنده‌ی backtest-core.js/divergence-detector.js/run-backtest.js می‌گشت —
        # کپی‌هایی که از artifact prep (شامل /tmp/artifact_src رمزگشایی‌شده) می‌اومدن.
        # الان به‌جای اتکا به artifact، دقیقاً مثل استپ ۱۳ جاب prepare، خودِ این جاب
        # مستقیماً encrypted_data/src.enc (که با checkout همین جاب از main میاد) را
        # با CODE_PASSWORD رمزگشایی می‌کند — بدون نیاز به منتقل کردن سورس رمزگشایی‌شده
        # از جاب دیگر یا از artifact.
        env:
          CODE_PASSWORD: ${{ secrets.CODE_PASSWORD }}
        run: |
          mkdir -p encrypted_data/src
          node -e "const crypto=require('crypto'),fs=require('fs');const pass=process.env.CODE_PASSWORD;const data=fs.readFileSync('encrypted_data/src.enc');const key=crypto.scryptSync(pass,'salt',32);const iv=data.slice(0,16),enc=data.slice(16);const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);const dec=Buffer.concat([decipher.update(enc),decipher.final()]);fs.writeFileSync('src.tar.gz',dec);"
          tar -xzf src.tar.gz -C encrypted_data/src
          rm src.tar.gz
          echo "===== بررسی فایل‌های بازیابی‌شده ====="
          for f in backtest-core.js divergence-detector.js run-backtest.js; do
            TARGET="encrypted_data/src/$f"
            if [ ! -f "$TARGET" ] || [ ! -s "$TARGET" ]; then
              echo "❌ $f پس از رمزگشایی وجود ندارد یا خالی است!"
              exit 1
            fi
            echo "✅ $f ($(stat -c%s "$TARGET") بایت)"
          done

      - name: رمزگشایی و نصب Wickra (آفلاین)
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
        run: |
          if [ -f "vendor/wickra.enc" ]; then
            echo "🔓 در حال رمزگشایی vendor/wickra.enc ..."
            node -e "
              const crypto=require('crypto'),fs=require('fs');
              const pass=process.env.RESULTS_PASSWORD;
              const data=fs.readFileSync('vendor/wickra.enc');
              const key=crypto.scryptSync(pass,'salt',32);
              const iv=data.slice(0,16), enc=data.slice(16);
              const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
              const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
              fs.writeFileSync('wickra.tgz',dec);
            "
            echo "📦 نصب wickra از فایل محلی ..."
            cd encrypted_data/src
            npm install ../../wickra.tgz --silent
            cd ../..
            rm -f wickra.tgz
            echo "✅ Wickra با موفقیت نصب شد."
          else
            echo "⚠️ فایل vendor/wickra.enc یافت نشد. نصب Wickra رد شد."
          fi

      - name: نصب papaparse
        run: |
          cd encrypted_data/src
          if [ ! -d node_modules/papaparse ]; then
            npm init -y --silent 2>/dev/null || true
            npm install papaparse --silent
          fi

      - name: ساختن پوشه‌های results و logs
        run: mkdir -p results logs

      - name: 🩺 4. بررسی سلامت قبل از اجرا
        run: |
          DATA_DIR="data/All_Coins_Combined"
          [ ! -d "$DATA_DIR" ] && { echo "❌ پوشه داده وجود ندارد."; exit 1; }
          echo "✅ پوشه داده: $DATA_DIR"

      - name: 5. اجرای بکتست
        id: backtest_run
        run: |
          set -e
          echo "شروع بکتست: ${{ matrix.strategy_file }} - چانک ${{ matrix.chunk }}"
          node encrypted_data/src/run-backtest.js \
            --strategy-file "strategies/${{ matrix.strategy_file }}" \
            --start-index ${{ matrix.chunk }} \
            --chunk-size 100 \
            --data-dir data/All_Coins_Combined \
            2>&1 | tee logs/backtest-output-${{ matrix.chunk }}.log
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}

      - name: کپی نتایج به ریشه
        if: always()
        run: |
          if [ -d encrypted_data/src/results ]; then
            cp -r encrypted_data/src/results/. results/ 2>/dev/null || true
          fi

      - name: 6. ثبت نتایج در مخزن (commit و push با ۱۰۰۰۰ تلاش + git stash)
        if: always()
        run: |
          mkdir -p results
          if [ -n "$(ls -A results 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            mkdir -p /tmp/git_temp_results
            cp -r results/. /tmp/git_temp_results/ 2>/dev/null || true
            mkdir -p /tmp/git_temp_src
            cp -r encrypted_data/src/. /tmp/git_temp_src/ 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            git update-index --assume-unchanged encrypted_data/src/backtest-core.js 2>/dev/null || true
            git update-index --assume-unchanged encrypted_data/src/divergence-detector.js 2>/dev/null || true
            git update-index --assume-unchanged encrypted_data/src/run-backtest.js 2>/dev/null || true
            if ! grep -qxF 'logs/' .gitignore 2>/dev/null; then
              echo 'logs/' >> .gitignore
            fi
            RETRY=0; MAX=10000
            while [ $RETRY -lt $MAX ]; do
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              # ⚠️ محافظت اضافه: جدا از رفع اصل مشکل (که دیگر tmp/ یا home/ از artifact
              # ساخته نمی‌شوند)، این pathspec به‌عنوان یک لایه‌ی دفاعی دوم، حتی اگر در
              # آینده هر مسیر ناخواسته‌ی دیگری به همین اسم‌ها ظاهر شود، از commit شدنش
              # جلوگیری می‌کند.
              git add -A -- . ':!logs' ':!tmp' ':!home' 2>/dev/null || true
              git commit -m "backtest ${{ matrix.strategy_file }} chunk ${{ matrix.chunk }}" 2>/dev/null || true
              if git pull --rebase && git push; then
                echo "✅ push موفق (تلاش $RETRY)"
                break
              else
                RETRY=$((RETRY+1))
                sleep $(( (RANDOM % 10) + 1 ))
              fi
            done
            if [ $RETRY -ge $MAX ]; then
              echo "❌ push ناموفق پس از $MAX تلاش"
              exit 1
            fi
          else
            echo "ℹ️ پوشه results خالی است یا وجود ندارد. هیچ کاری انجام نمی‌شود."
          fi

      - name: 7. بروزرسانی progress.json (با retry 10000 و مدیریت conflict)
        if: success()
        run: |
          STRAT_NAME="${{ matrix.strategy_file }}"
          CHUNK="${{ matrix.chunk }}"
          PROGRESS_FILE="progress.json"
          if [ ! -f "$PROGRESS_FILE" ]; then echo '{}' > $PROGRESS_FILE; fi
          cat $PROGRESS_FILE | jq --arg strat "$STRAT_NAME" --arg chunk "$CHUNK" '.[$strat] += [$chunk | tonumber]' > tmp.json && mv tmp.json $PROGRESS_FILE
          cp "$PROGRESS_FILE" /tmp/progress_backup.json 2>/dev/null || true
          git fetch origin main && git reset --hard origin/main
          cp /tmp/progress_backup.json "$PROGRESS_FILE" 2>/dev/null || true
          git update-index --assume-unchanged encrypted_data/src/backtest-core.js 2>/dev/null || true
          git update-index --assume-unchanged encrypted_data/src/divergence-detector.js 2>/dev/null || true
          git update-index --assume-unchanged encrypted_data/src/run-backtest.js 2>/dev/null || true
          git add $PROGRESS_FILE && git commit -m "update progress for $STRAT_NAME chunk $CHUNK" || true
          RETRY=0; MAX=10000
          while [ $RETRY -lt $MAX ]; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            cp /tmp/progress_backup.json "$PROGRESS_FILE" 2>/dev/null || true
            git update-index --assume-unchanged encrypted_data/src/backtest-core.js 2>/dev/null || true
            git update-index --assume-unchanged encrypted_data/src/divergence-detector.js 2>/dev/null || true
            git update-index --assume-unchanged encrypted_data/src/run-backtest.js 2>/dev/null || true
            git add $PROGRESS_FILE && git commit -m "update progress for $STRAT_NAME chunk $CHUNK" || true
            if git push; then
              echo "✅ push progress موفق (تلاش $RETRY)"
              break
            else
              RETRY=$((RETRY+1))
              sleep $(( (RANDOM % 10) + 1 ))
            fi
          done
          if [ $RETRY -ge $MAX ]; then
            echo "❌ push progress ناموفق پس از $MAX تلاش"
            exit 1
          fi

      - name: 8. ذخیره لاگ خطا با اثر انگشت (فقط در صورت شکست)
        if: failure()
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
        run: |
          SAFE_STRAT=$(echo "${{ matrix.strategy_file }}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          ERROR_FILE="error_${SAFE_STRAT}_chunk_${{ matrix.chunk }}_run.enc"
          LOG_FILE="logs/backtest-output-${{ matrix.chunk }}.log"
          if [ -f "$LOG_FILE" ]; then
            SIZE=$(stat -c%s "$LOG_FILE" 2>/dev/null || stat -f%z "$LOG_FILE")
            if [ "$SIZE" -gt 20000000 ]; then
              tail -c 20000000 "$LOG_FILE" > "${LOG_FILE}.trimmed" && mv "${LOG_FILE}.trimmed" "$LOG_FILE"
            fi
            node -e "
              const crypto=require('crypto'),fs=require('fs');
              const pass=process.env.RESULTS_PASSWORD;
              const data=fs.readFileSync('$LOG_FILE');
              const key=crypto.scryptSync(pass,'salt',32);
              const iv=crypto.randomBytes(16);
              const cipher=crypto.createCipheriv('aes-256-cbc',key,iv);
              const enc=Buffer.concat([cipher.update(data),cipher.final()]);
              fs.writeFileSync('$ERROR_FILE', Buffer.concat([iv,enc]));
            "
            mkdir -p errors && cp $ERROR_FILE errors/
            git fetch origin main && git checkout -B main origin/main
            git add errors/ && git commit -m "error log for ${{ matrix.strategy_file }} chunk ${{ matrix.chunk }}" || true
            RETRY=0; MAX=10000
            while [ $RETRY -lt $MAX ]; do
              git stash push --include-untracked --quiet || true
              if git pull --rebase && git push; then
                git stash drop --quiet || true
                break
              else
                git stash drop --quiet || true
                RETRY=$((RETRY+1))
                sleep $(( (RANDOM % 10) + 1 ))
              fi
            done
            if [ $RETRY -ge $MAX ]; then
              echo "❌ push error log ناموفق پس از $MAX تلاش"
              exit 1
            fi
          else
            echo "⚠️ فایل لاگ وجود ندارد، از ذخیره خطا صرف نظر می‌شود."
          fi

  trigger-loop:
    needs: [backtest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: فراخوانی Loop Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 راه‌اندازی loop.yml روی شاخه main ..."
          if gh workflow run loop.yml --repo "${{ github.repository }}" --ref main; then
            echo "✅ فراخوانی موفق بود."
          else
            echo "⚠️ فراخوانی اول ناموفق بود؛ ۵ ثانیه صبر و یک تلاش دوم..."
            sleep 5
            gh workflow run loop.yml --repo "${{ github.repository }}" --ref main || echo "❌ فراخوانی دوم هم ناموفق بود."
          fi
