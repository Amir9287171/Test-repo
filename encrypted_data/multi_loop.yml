name: Multi Backtest Loop Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: multi-backtest-loop
  cancel-in-progress: false

jobs:
  dispatch-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: بررسی وضعیت کار باقی‌مانده
        id: pending
        run: |
          python - <<'PY'
          import json, os, glob
          pending=True
          try:
              with open('strategies_config.json') as f: cfg=json.load(f)
              strategies=cfg.get('strategies', cfg if isinstance(cfg,list) else [])
              names=[]
              for x in strategies:
                  names.append(x.get('file',x.get('strategy_file',x.get('name'))) if isinstance(x,dict) else x)
              names=[x for x in names if x]
          except Exception:
              names=[os.path.basename(x) for x in glob.glob('strategies/*.js')]
          coins=['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','PAXGUSDT']
          try:
              with open('progress.json') as f: p=json.load(f)
          except Exception: p={}
          # The new backtest workflow itself builds the exact chunk list from the data.
          # Here we only avoid dispatching when there is no strategy at all.
          pending=bool(names and coins)
          print('strategies:',len(names),'coins:',len(coins),'pending:',pending)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"pending={'true' if pending else 'false'}\n")
          PY

      - name: اجرای دور بعدی
        if: steps.pending.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run multi_backtest.yml --repo "${{ github.repository }}" --ref main \
            -f max_jobs_per_run="10" \
            -f max_minutes="240"
          echo "✅ multi_backtest.yml برای دور بعدی dispatch شد."

      - name: بدون کار
        if: steps.pending.outputs.pending != 'true'
        run: echo "ℹ️ استراتژی یا داده‌ای برای اجرا پیدا نشد."
